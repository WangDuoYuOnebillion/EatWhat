<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E8">
<title>小付，今天吃什么？</title>
<!-- iOS:加到主屏后全屏运行、状态栏跟随、禁用电话号码自动识别 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃什么">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<!-- 加到主屏图标:iOS 只认真实 PNG 文件(不认 data: URI),必须与 index.html 同目录部署 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
/* ==========================================================================
   今天吃什么 · 样式层
   风格:暖米色杂志风 / 纸质食谱书
   规则:无阴影 · 1px 实线分隔 · 4px 小圆角 · 衬线标题 · 移动优先
   ========================================================================== */

:root{
  --bg:#F5F0E8;
  --surface:#FFFDF8;
  --surface-2:#EDE4D3;
  --ink:#2B2015;
  --ink-2:#7A6A56;
  --ink-3:#A2937E;
  --primary:#8B4513;
  --primary-soft:#A9673A;
  --warn:#C2703D;
  --danger:#A63A2E;
  --ok:#5C7A4A;
  --line:#DCCFB8;
  --line-2:#C9B99C;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif;
  --tabh:58px;
  --frame:480px;   /* 手机画框宽度上限 */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* iOS:禁止横屏时自动放大字号 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  /* iOS:阻止整页橡皮筋回弹 */
  overscroll-behavior-y:none;
  /* 画框外的底色(比 --bg 深一档)。手机上被 #app 完全盖住,只在桌面露出 */
  background:#E4DBC9;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit}
/* iOS Safari 聚焦 font-size < 16px 的输入框会强制放大整页,所以这里必须 16px */
input,select,textarea{font-size:16px;-webkit-appearance:none;appearance:none;border-radius:4px}
input[type=search]::-webkit-search-cancel-button,
input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
button{cursor:pointer;border:none;background:none;padding:0;font-size:inherit}
/* iOS:去掉长按选中/放大镜/弹出菜单,消除 300ms 点击延迟与双击缩放 */
button,.dish,.ing,.chip,.shop li,.sw,.tabbar button,.viz,.cb{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
/* 步骤与菜谱正文要允许选中复制,不能被上面一条波及 */
.sheet-bd,.cook-bd,.steps,.tipbox{-webkit-user-select:text;user-select:text}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.02em}
a{color:var(--primary)}
::selection{background:#E6D3B8}

/* ---------- 布局骨架 ---------- */
/* iOS:100vh 含地址栏会被裁,dvh 才是真实可视高度(不支持时回落 100vh) */
/* max-width 就是「手机画框」:桌面下收成一条 480px 居中列 */
#app{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  max-width:var(--frame);margin:0 auto;
  background:var(--bg);
  outline:1px solid var(--line);   /* outline 不占布局宽度,手机上画在屏幕外 */
  /* 极淡纸纹:两层低对比斜纹,总对比度 < 2% */
  background-image:
    repeating-linear-gradient(115deg, rgba(139,69,19,.014) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(25deg,  rgba(139,69,19,.010) 0 1px, transparent 1px 6px);
}
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  /* 加到主屏全屏运行时,顶部要让开刘海/灵动岛 */
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
          10px calc(14px + env(safe-area-inset-left));
  display:flex;align-items:center;gap:10px;
}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--primary);letter-spacing:.02em;min-width:0;white-space:nowrap}
@media(max-width:400px){.brand{font-size:17px;letter-spacing:0}}
@media(max-width:344px){.brand{font-size:15.5px}}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--ink-3);letter-spacing:.14em;margin-top:-2px}
.topbar .grow{flex:1}
.iconbtn{
  width:44px;height:44px;border:1px solid var(--line);border-radius:4px;
  background:var(--surface);display:grid;place-items:center;font-size:17px;color:var(--ink-2);
}
.iconbtn:active{background:var(--surface-2)}

main{
  flex:1;width:100%;
  padding:14px calc(14px + env(safe-area-inset-right))
          calc(var(--tabh) + 26px + env(safe-area-inset-bottom))
          calc(14px + env(safe-area-inset-left));
}

/* ---------- 底部 Tab(移动优先) ---------- */
.tabbar{
  /* fixed 元素默认相对视口,加了画框后会横跨整个桌面宽度 —— 必须自己收进画框 */
  position:fixed;bottom:0;z-index:50;
  left:50%;transform:translateX(-50%);width:min(var(--frame),100%);
  height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:var(--surface);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--ink-3);letter-spacing:.02em;position:relative;
}
.tabbar button i{font-style:normal;font-size:19px;line-height:1;filter:grayscale(.55);opacity:.7}
.tabbar button.on{color:var(--primary);font-weight:600}
.tabbar button.on i{filter:none;opacity:1}
.tabbar .dot{
  position:absolute;top:6px;left:50%;margin-left:8px;
  min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--danger);color:#fff;font-size:9.5px;line-height:15px;text-align:center;font-weight:700;
}

/* ---------- 通用元件 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.sec{margin-bottom:20px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:16.5px}
.sec-h .n{font-size:11.5px;color:var(--ink-3);font-family:var(--sans)}
.sec-h .grow{flex:1}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.muted{color:var(--ink-3)}
.rule{height:1px;background:var(--line);margin:14px 0;border:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 18px;border-radius:4px;
  border:1px solid var(--primary);background:var(--primary);color:#FFFCF5;
  font-size:15px;font-weight:600;letter-spacing:.03em;
}
.btn:active{background:#733A10}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.ghost:active{background:var(--surface-2)}
.btn.plain{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.plain:active{background:var(--surface-2)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;font-weight:500}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

.tag{
  display:inline-block;padding:1px 7px;border-radius:3px;
  background:var(--surface-2);color:var(--ink-2);
  font-size:11px;letter-spacing:.03em;white-space:nowrap;
}
.tag.ok{background:#E3EBDB;color:var(--ok)}
.tag.warn{background:#F6E4D6;color:var(--warn)}
.tag.danger{background:#F3DEDA;color:var(--danger)}
.tag.line{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}

/* 分段控件 */
.seg{display:flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:44px;padding:0 10px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:#FFFCF5;font-weight:600}

/* 开关行 */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lab{flex:1;min-width:0}
.row .lab b{display:block;font-weight:600;font-size:14.5px}
.row .lab span{display:block;font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:1px}
.sw{width:46px;height:27px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);transition:transform .15s}
.sw.on{background:var(--primary);border-color:var(--primary)}
.sw.on::after{transform:translateX(19px);border-color:var(--primary-soft)}

/* ---------- 食材选择 ---------- */
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{
  width:100%;min-height:48px;padding:0 42px 0 36px;
  border:1px solid var(--line-2);border-radius:4px;background:var(--surface);
  font-size:16px;outline:none;
}
.searchwrap input:focus{border-color:var(--primary-soft)}
.searchwrap .mg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
.searchwrap .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;color:var(--ink-3);font-size:15px}

.chipbar{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:10px;margin-bottom:14px;
}
.chipbar .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chipbar .hd b{font-family:var(--serif);font-size:14px}
.chipbar .hd .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:3px;border:1px solid var(--primary);
  background:#F7ECE0;color:var(--primary);font-size:12.5px;
}
.chip b{font-weight:500}
.chip span{color:var(--primary-soft);font-size:14px;line-height:1}

.catnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav button{
  flex:none;padding:6px 12px;border:1px solid var(--line-2);border-radius:3px;
  background:var(--surface);font-size:13px;color:var(--ink-2);white-space:nowrap;
}
.catnav button.on{background:var(--primary);border-color:var(--primary);color:#FFFCF5;font-weight:600}

.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.ing{
  border:1px solid var(--line);border-radius:4px;background:var(--surface);
  padding:9px 4px 7px;text-align:center;min-height:66px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;transition:background .12s;
}
.ing em{font-style:normal;font-size:21px;line-height:1;filter:grayscale(.2)}
.ing b{font-weight:400;font-size:12.5px;letter-spacing:.02em}
.ing.on{background:#F7ECE0;border-color:var(--primary);color:var(--primary)}
.ing.on b{font-weight:600}
.ing.on em{filter:none}
.ing .badge{position:absolute;top:3px;right:3px;font-size:9.5px;padding:0 4px;border-radius:2px;line-height:14px}
.ing .badge.warn{background:var(--warn);color:#fff}
.ing .badge.danger{background:var(--danger);color:#fff}
.ing .badge.inv{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}

/* iOS:软键盘弹起时 position:fixed 元素会跟着乱跳,聚焦搜索框期间直接隐藏 */
body.kb .stickycta{display:none}
/* 吸底 CTA 是 fixed 的,不占文档流 —— 必须在流里放一块等高占位,
   否则列表最后一排会被它永久盖住,滚动也露不出来(实测发现的 bug) */
.ctaspacer{height:70px}
.stickycta{
  position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);width:min(var(--frame),100%);
  z-index:45;background:linear-gradient(to top,var(--bg) 62%,rgba(245,240,232,0));
  padding:9px calc(14px + env(safe-area-inset-right)) 9px calc(14px + env(safe-area-inset-left));
}

/* ---------- 菜卡 ---------- */
.tier{margin-bottom:22px}
.tier-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.tier-h h2{font-size:17px}
.tier-h .n{font-size:11.5px;color:var(--ink-3)}
.tier-h .why{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right;max-width:48%;line-height:1.4}

.dishes{display:grid;grid-template-columns:1fr;gap:10px}
.dish{
  display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  overflow:hidden;text-align:left;width:100%;align-items:stretch;
}
.dish:active{background:#FCF7EC}
.viz{
  flex:none;width:78px;display:grid;place-items:center;font-size:33px;
  border-right:1px solid var(--line);line-height:1;
}
.viz[data-cat=stirfry]  {background:linear-gradient(140deg,#F7E5C3,#E9C48F)}
.viz[data-cat=stew]     {background:linear-gradient(140deg,#EBD2C0,#CE9E7C)}
.viz[data-cat=soup]     {background:linear-gradient(140deg,#DFE7E4,#B5C8C3)}
.viz[data-cat=cold]     {background:linear-gradient(140deg,#E6EBD8,#C2D0A6)}
.viz[data-cat=steam]    {background:linear-gradient(140deg,#F2ECE0,#D8CBB4)}
.viz[data-cat=staple]   {background:linear-gradient(140deg,#F5EBCF,#E3CE9A)}
.viz[data-cat=breakfast]{background:linear-gradient(140deg,#F8E6DA,#EBC4A9)}
.viz[data-cat=bake]     {background:linear-gradient(140deg,#EDD8C2,#C99366)}
.dish .body{flex:1;min-width:0;padding:9px 11px}
.dish .t1{display:flex;align-items:baseline;gap:6px}
.dish .t1 h3{font-size:16px;font-weight:600}
.dish .t1 .fav{font-size:12px;color:var(--warn)}
.dish .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.dish .kcal{font-family:var(--serif);font-size:13px;color:var(--primary);font-weight:600}
.dish .kcalrow{display:block;margin-top:5px;font-family:var(--serif);font-size:13.5px;color:var(--primary);font-weight:600;letter-spacing:.01em}
.dish .miss{
  margin-top:6px;font-size:12px;color:var(--warn);
  border-top:1px dashed var(--line-2);padding-top:5px;line-height:1.5;
}
.dish .miss b{font-weight:600}
.dish .use{margin-top:5px;font-size:11.5px;color:var(--ok)}

/* ---------- 空态 / 引导 ---------- */
.empty{
  border:1px dashed var(--line-2);border-radius:4px;background:var(--surface);
  padding:28px 20px;text-align:center;
}
.empty .big{font-size:34px;line-height:1;margin-bottom:10px;filter:grayscale(.3)}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{font-size:13px;color:var(--ink-2);margin:0 auto 14px;max-width:30em;line-height:1.7}

/* ---------- 抽屉 / 弹层 ---------- */
/* 遮罩与抽屉:只靠 opacity/transform 控制显隐是不够的 ——
   不激活时必须显式关掉 pointer-events,否则一层不可见的全屏元素
   会把整页的点击全部吃掉(这个 bug 真实发生过,见 DECISIONS ADR-018) */
.scrim{position:fixed;inset:0;background:rgba(43,32,21,.42);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;z-index:61;
  left:50%;width:min(var(--frame),100%);
  max-height:92vh;max-height:92dvh;background:var(--bg);
  border-top:1px solid var(--line-2);border-radius:8px 8px 0 0;
  transform:translate(-50%,101%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  pointer-events:none;
}
.sheet.on{transform:translate(-50%,0);pointer-events:auto}
.sheet-hd{
  flex:none;padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;background:var(--bg);
  border-radius:8px 8px 0 0;
}
.sheet-hd .grab{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:34px;height:3px;border-radius:2px;background:var(--line-2)}
.sheet-hd h2{flex:1;min-width:0;font-size:18px}
/* overscroll-behavior:contain —— 抽屉滚到底时不把整页一起带着滚 */
.sheet-bd{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-ft{flex:none;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface);
  padding:10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
.sheet-ft .btn{flex:1}

/* 菜谱详情 */
.hero{
  height:110px;border:1px solid var(--line);border-radius:4px;
  display:grid;place-items:center;font-size:58px;line-height:1;margin-bottom:12px;
}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:4px;background:var(--surface);margin-bottom:14px}
.statbar div{padding:9px 4px;text-align:center;border-right:1px solid var(--line)}
.statbar div:last-child{border-right:0}
.statbar b{display:block;font-family:var(--serif);font-size:16px;color:var(--primary);font-weight:600;line-height:1.2}
.statbar span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;margin-top:2px}

.iglist{list-style:none;margin:0;padding:0}
.iglist li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line)}
.iglist li:last-child{border-bottom:0}
.iglist .nm{flex:1;min-width:0}
.iglist .qt{font-family:var(--serif);color:var(--ink-2);white-space:nowrap;font-size:14px}
.iglist li.lack .nm{color:var(--danger)}
.iglist li.lack .qt{color:var(--danger)}
.iglist .sub{display:block;font-size:11.5px;color:var(--warn);line-height:1.5;margin-top:1px}
.grp-h{font-family:var(--serif);font-size:13px;color:var(--ink-3);letter-spacing:.1em;margin:12px 0 2px}
.grp-h:first-child{margin-top:0}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .no{
  flex:none;width:25px;height:25px;border-radius:50%;border:1px solid var(--primary);
  color:var(--primary);font-family:var(--serif);font-size:13px;display:grid;place-items:center;font-weight:600;
}
.steps .tx{flex:1;min-width:0;line-height:1.7}
.steps .mn{display:inline-block;margin-left:6px;font-size:11px;color:var(--ink-3);white-space:nowrap}

.nutr{display:grid;gap:9px;margin-top:4px}
.nutr .bar{display:flex;align-items:center;gap:9px;font-size:13px}
.nutr .bar .k{width:52px;flex:none;color:var(--ink-2)}
.nutr .bar .tr{flex:1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.nutr .bar .fl{height:100%;border-radius:4px}
.nutr .bar .v{width:56px;flex:none;text-align:right;font-family:var(--serif);font-size:13.5px}
.tipbox{border-left:2px solid var(--primary-soft);padding:2px 0 2px 11px;font-size:13px;color:var(--ink-2);line-height:1.7}

/* ---------- 做菜模式 ---------- */
.cook{
  position:fixed;top:0;bottom:0;z-index:80;background:var(--bg);
  left:50%;transform:translateX(-50%);width:min(var(--frame),100%);
  display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  height:100dvh;
}
.cook.on{display:flex}
.cook-hd{flex:none;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.cook-hd h2{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{flex:none;height:3px;background:var(--surface-2)}
.prog i{display:block;height:100%;background:var(--primary);transition:width .2s}
.cook-bd{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:26px calc(22px + env(safe-area-inset-right)) 26px calc(22px + env(safe-area-inset-left))}
.cook-bd .stepno{font-family:var(--serif);font-size:13px;color:var(--ink-3);letter-spacing:.14em;margin-bottom:14px}
.cook-bd .steptx{font-size:25px;line-height:1.62;font-weight:500;letter-spacing:.01em}
/* 原先这里有 @media(min-width:700px) 把步骤字号放大到 31px。
   加了 480px 画框后,视口 >=700px 只意味着「桌面」,而做菜层被画框限成 480px 宽,
   31px 在这个宽度里会撑得很难看。已删除 —— 25px 在 320-480px 全区间都成立。 */
.cook-bd .ings-mini{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.8}
.timer{
  margin-top:22px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);
  padding:14px;display:flex;align-items:center;gap:14px;
}
.timer .num{font-family:var(--serif);font-size:38px;font-weight:600;color:var(--primary);line-height:1;font-variant-numeric:tabular-nums}
.timer .grow{flex:1}
.cook-ft{flex:none;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface);
  padding:12px calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left))}
.cook-ft .btn{flex:1;min-height:56px;font-size:17px}

/* ---------- 库存 ---------- */
.invlist{list-style:none;margin:0;padding:0}
.invlist li{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.invlist .iconbtn,.planrow .iconbtn{width:40px;height:40px;flex:none}
.invlist li:last-child{border-bottom:0}
.invlist em{font-style:normal;font-size:22px;flex:none;line-height:1}
.invlist .nm{flex:1;min-width:0}
.invlist .nm b{display:block;font-weight:500;font-size:14.5px}
.invlist .nm span{display:block;font-size:11.5px;color:var(--ink-3)}
.daybtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.daybtns button{padding:7px 12px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);font-size:13px;min-height:38px}
.daybtns button:active{background:var(--primary);color:#fff;border-color:var(--primary)}

.alertbar{
  border:1px solid var(--warn);border-left-width:3px;border-radius:4px;
  background:#FBF1E8;padding:10px 12px;font-size:13px;color:#8A4A20;margin-bottom:14px;line-height:1.6;
}
.alertbar b{font-weight:600}

/* ---------- 购物清单 ---------- */
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line)}
.shop li:last-child{border-bottom:0}
.cb{width:21px;height:21px;flex:none;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);display:grid;place-items:center;font-size:13px;color:transparent}
.cb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.shop li.done .nm{text-decoration:line-through;color:var(--ink-3)}

/* ---------- 摆一摆 ---------- */
.roll{
  border:1px solid var(--line-2);border-radius:4px;background:var(--surface);
  padding:20px;text-align:center;margin-bottom:14px;
}
.roll .face{font-size:52px;line-height:1;margin-bottom:8px}
.roll h3{font-size:21px;margin-bottom:4px}
.roll.spin .face{animation:flip .42s ease}
@keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(.7);opacity:.3}100%{transform:rotateY(0) scale(1)}}

.plan{display:grid;gap:10px}
.planrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.planrow .slot{flex:none;width:34px;font-family:var(--serif);font-size:12px;color:var(--ink-3);text-align:center;line-height:1.3}
.planrow em{font-style:normal;font-size:24px;flex:none}
.planrow .nm{flex:1;min-width:0}
.planrow .nm b{display:block;font-weight:600;font-size:15px}
.planrow .nm span{display:block;font-size:11.5px;color:var(--ink-3)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + 34px);transform:translate(-50%,14px);
  z-index:90;background:#3A2C1D;color:#F8F1E5;padding:9px 16px;border-radius:4px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;max-width:86vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ==========================================================================
   只做手机端(CLAUDE.md 红线 2 / ADR-019)
   ——————————————————————————————————————————————————————————————————————
   这里刻意「没有」桌面断点。桌面浏览器打开时,靠 #app 的 max-width
   收成一条居中的手机画框,布局与手机完全一致,不是第二套设计。

   画框的实现刻意不用媒体查询:
     body 用比 --bg 深一档的底色 + #app 用 --bg 本色
     → 手机上 #app 撑满宽度,深色底永远看不见
     → 桌面上自然露出画框两侧的深色区
   边界线用 outline 而不是 border,因为 outline 不占布局宽度,
   手机上它被画到屏幕外,不会吃掉那 2px。
   ========================================================================== */

/* 允许保留的两个媒体查询:都是手机内部的小屏适配,不构成第二套布局 */
@media(max-width:400px){ .statbar b{font-size:15px} }
@media(max-width:344px){
  .ings{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .tabbar button{font-size:10px}
}

 tp:'豆角没熟透会中毒,这不是口感问题。焯 5 分钟或煸到表皮起皱发软,颜色从鲜绿变成暗绿才算熟。'},

{id:'roumoqiezi',n:'肉末茄子',e:'🍆',cat:'stirfry',cu:'家常',t:28,d:2,sp:1,tl:['wok'],tg:['下饭','经典','家常'],

     {t:'热锅多油,下茄条中火煎 5 分钟至表面微焦软塌,盛出。',m:6},

     {t:'倒回茄子,中火焖 3 分钟让茄子吸满汤汁。',m:4},

{id:'gulaorou',n:'咕咾肉',e:'🍍',cat:'stirfry',cu:'粤菜',t:40,d:3,sp:0,tl:['wok'],tg:['宴客','孩子爱吃','经典'],

     {t:'油温六成热(筷子插进去冒小泡)下肉块,中火炸 4 分钟至定型微黄,捞出。',m:6},
     {t:'油温升到八成热,回锅复炸 40 秒至金黄酥脆,捞出沥油。复炸是酥脆不回软的关键。',m:3},
     {t:'调糖醋汁:番茄酱 3 勺、醋 2 勺、糖 2.5 勺、清水 3 勺、淀粉半勺搅匀。',m:3},
     {t:'锅留少许油,下洋葱青椒胡萝卜块炒 90 秒,倒入糖醋汁烧到冒泡变浓。',m:3},
     {t:'倒入炸好的肉块,快速翻匀让每块挂上汁,立刻出锅。',m:2}],
 tp:'两次油炸不能省:第一次定型熟透,第二次高温脱水上色。挂汁要在最后 20 秒完成,裹久了外壳就软了。'},

{id:'gongbaojiding',n:'宫保鸡丁',e:'🥜',cat:'stirfry',cu:'川菜',t:30,d:3,sp:2,tl:['wok'],tg:['下饭','经典','宴客','重口'],

     {t:'热油下鸡丁大火炒 90 秒至表面变白微焦,盛出。',m:3},

     {t:'下姜蒜末和葱白炒香,倒回鸡丁,淋入宫保汁大火翻炒 40 秒收汁。',m:2},

     {t:'油温七成热下鸡块,中火炸 5 分钟至表面金黄,捞出。',m:7},

     {t:'锅留 2 勺油,小火下花椒和干辣椒段慢炒 90 秒至辣椒微微发暗、香气窜出来。',m:3},
     {t:'下姜蒜末炒香,倒入鸡块,加少许盐和糖,大火翻炒 90 秒让每块都裹上椒香。',m:3},

     {t:'锅烧到冒烟,下油,牛肉条平铺下锅,不要马上翻动,煎 40 秒再翻,总共 90 秒盛出。',m:3},
     {t:'补油下洋葱炒 2 分钟至微软,下青椒胡萝卜炒 1 分钟。',m:3},

{id:'yangcongniurou',n:'洋葱炒牛肉',e:'🧅',cat:'stirfry',cu:'家常',t:28,d:2,sp:1,tl:['wok'],tg:['下饭','高蛋白','增肌'],

     {t:'洋葱切丝,青椒切丝。',m:4},
     {t:'大火热油,牛肉片下锅摊平煎 30 秒再翻炒,共 80 秒盛出。',m:2},

{id:'congbaoyangrou',n:'葱爆羊肉',e:'🍖',cat:'stirfry',cu:'北方',t:22,d:2,sp:1,tl:['wok'],tg:['快手','冬天','高蛋白','增肌'],

     {t:'调汁:生抽 1.5 勺、老抽半勺、醋 1 勺、糖半勺、盐,搅匀。醋是去羊肉膻味的关键。',m:2},

{id:'xiarenhuadan',n:'虾仁滑蛋',e:'🦐',cat:'stirfry',cu:'粤菜',t:22,d:3,sp:0,tl:['wok'],tg:['高蛋白','宴客','低碳水','快手'],

 st:[{t:'虾仁去虾线,用少许盐和淀粉抓洗两遍再冲净——这样虾仁才脆弹。',m:6},
     {t:'虾仁加盐、料酒、半勺淀粉、胡椒粉抓匀腌 10 分钟。',m:11},
     {t:'鸡蛋打散,加 2 勺牛奶、少许盐和几滴香油,搅到完全均匀。牛奶让蛋更滑更香。',m:3},

     {t:'小火,等蛋液边缘凝固就用铲子从边缘往中间轻推,推成大片嫩块。',m:2},
     {t:'蛋液还有三成是流动状态时,倒回虾仁,轻轻拌两下立刻关火出锅。',m:1}],
 tp:'滑蛋的全部技术在"欠火":看起来还没全熟就出锅,余温会把它带到刚好。炒到看起来熟了,端上桌就是老的。'},

{id:'shousibaocai',n:'手撕包菜',e:'🥬',cat:'stirfry',cu:'家常',t:15,d:1,sp:2,tl:['wok'],tg:['快手','低卡','素菜','减脂','下饭'],

 tp:'这道菜只有两个技术点:手撕、大火。醋一定沿着热锅边淋进去,不要直接浇在菜上。'},

{id:'culiubaicai',n:'醋溜白菜',e:'🥬',cat:'stirfry',cu:'北方',t:15,d:1,sp:1,tl:['wok'],tg:['快手','低卡','素菜','减脂','冬天'],

     {t:'大火下白菜帮炒 2 分钟至半透明。',m:2},
     {t:'下白菜叶炒 40 秒,淋入调好的汁,大火翻 30 秒收汁出锅。',m:2}],

     {t:'加蚝油 1.5 勺、生抽 1 勺、糖半勺、小半碗水烧开。',m:2},

{id:'qingchaoxilanhua',n:'清炒西兰花',e:'🥦',cat:'stirfry',cu:'家常',t:15,d:1,sp:0,tl:['pot','wok'],tg:['低卡','素菜','减脂','新手友好'],

     {t:'热油下蒜末爆香,下胡萝卜片炒 1 分钟。',m:2},
     {t:'下西兰花大火炒 1 分钟,加盐、蚝油、生抽和少许糖。',m:2},
     {t:'淋一点淀粉水勾薄芡,翻匀出锅。',m:1}],
 tp:'先焯水后快炒,西兰花才既熟透又保持翠绿脆感。直接生炒的话,要炒很久才熟,颜色早就发黄了。'},

{id:'culiutudousi',n:'醋溜土豆丝',e:'🥔',cat:'stirfry',cu:'家常',t:20,d:2,sp:1,tl:['wok'],tg:['快手','素菜','下饭','经典'],
 m:[{i:'tudou',q:2,u:'个'}],s:[{i:'qingjiao',q:1,u:'个'},{i:'ganlajiao',q:3,u:'个'}],
 se:['cu','yan','tang','you','suan','huajiao','shengchou'],
 nu:{k:130,p:3,f:5,c:19},
 st:[{t:'土豆切细丝,越细越好。切好立刻放进清水里。',m:7},
     {t:'反复换水冲洗 3 遍,洗到水完全清澈——洗掉表面淀粉是土豆丝脆而不粘的唯一办法。',m:4},
     {t:'捞出彻底沥干。青椒切丝,干辣椒剪段。',m:3},
     {t:'热油下干辣椒和花椒小火炒 20 秒,下蒜片爆香。',m:1},
     {t:'转最大火倒入土豆丝,快速翻炒 90 秒。',m:2},
     {t:'沿锅边淋 2 勺醋,加盐、少许糖和青椒丝,再炒 40 秒立刻出锅。',m:2}],
 tp:'洗淀粉和大火快炒,决定这盘是"脆的醋溜土豆丝"还是"糊的土豆泥"。醋要分两次:一次锅边淋增香,出锅前再补几滴保酸味。'},

{id:'ganbiandoujiao',n:'干煸豆角',e:'🫘',cat:'stirfry',cu:'川菜',t:30,d:2,sp:2,tl:['wok'],tg:['下饭','重口','经典'],
 m:[{i:'doujiao',q:400,u:'g'},{i:'roumo',q:100,u:'g'}],s:[{i:'ganlajiao',q:6,u:'个'},{i:'suan',q:5,u:'瓣'}],
 se:['huajiao','shengchou','laochou','yan','tang','you','jiang','ziran'],
 nu:{k:220,p:9,f:16,c:9},
 st:[{t:'豆角掰去两头和筋,折成 5cm 段,洗净彻底擦干。有水下锅会炸油。',m:7},
     {t:'锅中稍多油,中火下豆角慢煸 8 分钟——耐心煸到表皮起皱、发白发软,这就是"干煸"。',m:9},
     {t:'豆角推到锅边或盛出,下肉末炒散炒出油。',m:3},
     {t:'加干辣椒段、花椒、姜蒜末小火炒 40 秒出香。',m:2},
     {t:'倒回豆角,加生抽、少许老抽、盐、半勺糖和孜然,大火翻炒 2 分钟至完全干香。',m:3},
     {t:'全程不加水,出锅。',m:1}],
 tp:'"干煸"的意思是用油和时间把水分逼出去,煸 8 分钟不能偷懒。表皮起皱是熟透的标志,同时也解决了豆角的食品安全问题。'},

{id:'disanxian',n:'地三鲜',e:'🍆',cat:'stirfry',cu:'东北',t:30,d:2,sp:0,tl:['wok'],tg:['下饭','素菜','经典','宴客'],
 m:[{i:'qiezi',q:400,u:'g'},{i:'tudou',q:2,u:'个'},{i:'qingjiao',q:2,u:'个'}],s:[{i:'suan',q:5,u:'瓣'}],
 se:['shengchou','laochou','haoyou','tang','dianfen','you','yan','jiang'],
 nu:{k:243,p:4,f:16,c:22},

     {t:'调汁:生抽 2 勺、老抽半勺、蚝油 1 勺、糖 1 勺、淀粉 1 勺、清水 5 勺搅匀。',m:2},
     {t:'油温六成热先下土豆块,中火炸 4 分钟至表面金黄能插透,捞出。',m:5},
     {t:'油温升高下茄子块,炸 2 分钟至变软金黄,捞出。最后下青椒块过油 20 秒捞出。',m:4},
     {t:'锅留少许油,下姜蒜末爆香。',m:1},
     {t:'倒入三样食材,淋入碗汁,大火翻炒 60 秒收汁挂匀出锅。',m:3}],
 tp:'三样分开过油、先硬后软:土豆最久、茄子次之、青椒最后。一起下锅必然一半焦一半生。想省油可以改用少油煎。'},

{id:'hongshaoqiezi',n:'红烧茄子',e:'🍆',cat:'stirfry',cu:'家常',t:25,d:2,sp:1,tl:['wok'],tg:['下饭','素菜','家常'],
 m:[{i:'qiezi',q:500,u:'g'}],s:[{i:'qingjiao',q:1,u:'个'},{i:'suan',q:5,u:'瓣'},{i:'cong',q:1,u:'根'}],

     {t:'调汁:生抽 2 勺、老抽半勺、蚝油 1 勺、糖 1 勺、醋半勺、淀粉半勺、清水半碗。',m:2},
     {t:'锅中稍多油,下茄块中火煎 5 分钟至四面金黄软塌,盛出。',m:6},
     {t:'锅留底油,下姜蒜末和半勺豆瓣酱小火炒 40 秒。',m:2},
     {t:'倒回茄子,淋入碗汁,中火焖 3 分钟让茄子吸饱汁。',m:4},
     {t:'加青椒块翻炒 40 秒,撒葱花出锅。',m:1}],
 tp:'盐腌挤水是省油的核心。茄子像海绵,不挤水就会疯狂吸油;挤过水的茄子既省油,煎出来也更容易上色。'},

{id:'fanqiecaihua',n:'番茄炒菜花',e:'🥦',cat:'stirfry',cu:'家常',t:22,d:1,sp:0,tl:['wok'],tg:['低卡','素菜','减脂','下饭'],

     {t:'开水下菜花焯 2 分钟至半熟,捞出沥干。菜花比西兰花硬,不焯很难炒熟。',m:4},
     {t:'热油下蒜末爆香,下西红柿中火炒 4 分钟至出沙成糊。',m:5},
     {t:'加 1 勺番茄酱增色增酸(可省略),加盐和半勺糖。',m:1},
     {t:'倒入菜花,大火翻炒 2 分钟让每朵都裹上番茄汁,加几滴生抽出锅。',m:3}],
 tp:'菜花焯水是必须的。西红柿一定要炒到出沙成糊,才能挂在菜花的缝隙里,不然就是菜花配番茄块。'},

{id:'suchaowosun',n:'素炒莴笋',e:'🌿',cat:'stirfry',cu:'家常',t:15,d:1,sp:0,tl:['wok'],tg:['低卡','素菜','减脂','快手'],

     {t:'莴笋片撒少许盐腌 3 分钟,倒掉水——这步让莴笋更脆更入味。',m:4},
     {t:'热油下蒜片爆香,下木耳和胡萝卜炒 1 分钟。',m:2},
     {t:'大火下莴笋片炒 90 秒至半透明,加盐、生抽、少许糖。',m:2},
     {t:'滴几滴香油翻匀出锅。',m:1}],
 tp:'莴笋的清甜脆感全靠短时间大火。炒到发软就失去意义了,90 秒断生最好。'},

{id:'xiangguqingcai',n:'香菇青菜',e:'🍄',cat:'stirfry',cu:'家常',t:18,d:1,sp:0,tl:['wok'],tg:['低卡','素菜','减脂','新手友好'],

     {t:'热油下蒜末爆香,下香菇中火炒 3 分钟至变软出香。香菇要炒透才不腥。',m:4},
     {t:'转大火下小白菜,炒 90 秒至菜叶变软、菜梗仍脆。',m:2},
     {t:'加蚝油 1 勺、生抽 1 勺、盐、少许糖,翻匀。',m:2},
     {t:'淋一点淀粉水收成薄芡出锅。',m:2}],
 tp:'香菇必须单独先炒透。和青菜一起下锅的话,青菜熟了香菇还是生的,那股土腥味会毁掉整盘菜。'},

{id:'qingchaooupian',n:'清炒藕片',e:'🪷',cat:'stirfry',cu:'江浙',t:18,d:1,sp:1,tl:['wok'],tg:['低卡','素菜','减脂','快手'],

     {t:'大火下藕片炒 2 分钟,沿锅边淋 1.5 勺醋——醋能让藕片保持雪白脆爽。',m:3},
     {t:'下青椒和木耳炒 1 分钟,加盐、少许糖和生抽翻匀出锅。',m:3}],

{id:'jiucaidouya',n:'韭菜炒豆芽',e:'🌱',cat:'stirfry',cu:'家常',t:12,d:1,sp:1,tl:['wok'],tg:['快手','低卡','素菜','减脂'],

     {t:'热油下蒜末和尖椒爆香。',m:1},
     {t:'转最大火倒入豆芽,快炒 90 秒——豆芽出水快,火小了就变成煮豆芽。',m:2},
     {t:'沿锅边淋半勺醋,下韭菜炒 40 秒。',m:2},
     {t:'加盐和几滴生抽,翻 15 秒立刻出锅。',m:2}],
 tp:'这道菜的敌人是水。豆芽和韭菜都极易出水,只能靠最大火在 2 分钟内完成。盐一定最后放。'},

{id:'suanxiangbocai',n:'蒜香菠菜',e:'🥬',cat:'stirfry',cu:'家常',t:12,d:1,sp:0,tl:['wok'],tg:['快手','低卡','素菜','减脂','新手友好'],

 st:[{t:'菠菜洗净切段,根部保留(红根最甜)。彻底沥干。',m:5},
     {t:'热锅多油,下一半蒜末爆 15 秒。',m:1},
     {t:'转最大火,先下菠菜根部炒 30 秒,再下叶子。',m:2},
     {t:'总共炒 90 秒至叶片刚塌,加盐、生抽和剩下的生蒜末。',m:2},
     {t:'滴几滴香油,翻匀立刻出锅,连汁一起盛出。',m:2}],
 tp:'菠菜草酸重,如果给孩子或老人吃,可以先焯 30 秒再炒。直接炒的话香味更足,但要接受一点涩感。'},

{id:'jianjiaogandoufu',n:'尖椒干豆腐',e:'📄',cat:'stirfry',cu:'东北',t:18,d:1,sp:2,tl:['wok'],tg:['下饭','高蛋白','低碳水','家常'],

     {t:'尖椒斜切段,猪肉切丝(可省略)。',m:3},
     {t:'热油下肉丝炒至变白,加姜蒜末爆香。',m:2},
     {t:'下尖椒大火炒 90 秒至表皮起虎皮斑。',m:2},
     {t:'下干豆腐,加生抽 2 勺、少许老抽、蚝油 1 勺、盐和半勺糖,翻炒 2 分钟。',m:3},
     {t:'淋少许淀粉水勾薄芡出锅。',m:2}],

{id:'xiangganqincai',n:'香干炒芹菜',e:'🟫',cat:'stirfry',cu:'江浙',t:18,d:1,sp:0,tl:['wok'],tg:['低卡','素菜','减脂','下饭'],

     {t:'热油下蒜末爆香,下香干片中火炒 2 分钟至边缘微焦出香。',m:3},
     {t:'转大火下芹菜和胡萝卜炒 2 分钟至断生。',m:3},
     {t:'加生抽、蚝油、盐、少许糖翻匀,滴香油出锅。',m:3}],
 tp:'香干先煎到边缘微焦,豆香才出来。这道菜清爽高蛋白,每份不到 160 kcal,是减脂期少见的又好吃又管饱的素菜。'},

{id:'ganguotudou',n:'干锅土豆片',e:'🥔',cat:'stirfry',cu:'川菜',t:30,d:2,sp:2,tl:['wok'],tg:['下饭','重口','宴客'],

 se:['doubanjiang','shengchou','laochou','haoyou','tang','you','suan','jiang','huajiao','yan','ziran'],
 nu:{k:307,p:8,f:20,c:24},
 st:[{t:'土豆切 3mm 厚片,冲洗掉淀粉,沥干。五花肉切薄片。',m:8},
     {t:'锅中稍多油,下土豆片中火煎 6 分钟,两面金黄边缘微脆,盛出。',m:7},
     {t:'锅中下五花肉片煎出油,加姜蒜末、干辣椒、花椒小火炒 40 秒。',m:4},
     {t:'加 1 勺豆瓣酱小火炒 40 秒出红油。',m:2},
     {t:'下洋葱和青椒块炒 90 秒。',m:2},
     {t:'倒回土豆片,加生抽、少许老抽、蚝油、半勺糖和孜然,大火翻炒 2 分钟,不加水,出锅。',m:3}],
 tp:'土豆片要煎到边缘发脆而不是炒软,这是"干锅"和"炒土豆片"的区别。全程不加水,靠油和火气逼出香味。'},

{id:'mapodoufu',n:'麻婆豆腐',e:'🍲',cat:'stirfry',cu:'川菜',t:25,d:2,sp:3,tl:['wok'],tg:['下饭','经典','重口','高蛋白'],

 se:['doubanjiang','huajiao','lajiaomian','shengchou','laochou','dianfen','you','suan','jiang','tang','yan'],
 nu:{k:250,p:16,f:18,c:6},
 st:[{t:'豆腐切 2cm 方块,放淡盐水里焯 2 分钟——盐水焯过的豆腐不易碎、豆腥味也去了。轻轻捞出。',m:6},
     {t:'热油下肉末炒散,炒到微微焦香出油。',m:4},
     {t:'转小火,加 1.5 勺豆瓣酱和 1 勺辣椒面炒 60 秒,炒出红油再下姜蒜末。',m:2},
     {t:'加生抽、少许老抽和一碗清水烧开。',m:2},
     {t:'轻轻推入豆腐块(用铲子背推,别翻搅),中火煮 4 分钟入味。',m:5},
     {t:'分三次淋入淀粉水,每次等汤汁重新沸腾再加,收成浓稠挂勺的状态。',m:3},
     {t:'关火,撒现磨花椒粉和葱花。花椒粉一定最后撒,麻味才冲。',m:2}],
 tp:'两个专业细节:豆腐用盐水焯过就不会碎;芡分三次勾,汁才能真正"抱"住豆腐。花椒粉出锅后撒,下锅炒就只剩苦味没有麻香。'},

{id:'hongshaorou',n:'红烧肉',e:'🍖',cat:'stew',cu:'家常',t:80,d:3,sp:0,tl:['pot'],tg:['宴客','下饭','经典','冬天'],

     {t:'下青椒块,淋淀粉水勾芡,撒葱花出锅。',m:2}],
 tp:'豆腐必须先煎出硬壳,后面焖的时候才不会碎成渣,还能吸住汤汁。吸干表面水是煎不粘锅的前提。'},

{id:'qieziqmendoujiao',n:'茄子焖豆角',e:'🍆',cat:'stew',cu:'家常',t:32,d:2,sp:1,tl:['wok'],tg:['下饭','素菜','家常'],
 m:[{i:'qiezi',q:400,u:'g'},{i:'doujiao',q:300,u:'g'}],s:[{i:'xihongshi',q:1,u:'个'},{i:'suan',q:6,u:'瓣'}],

 nu:{k:180,p:5,f:11,c:16},
 st:[{t:'茄子切条泡盐水挤干,豆角折段,西红柿切块。',m:8},
     {t:'豆角必须炒透:锅中稍多油,中火煸豆角 6 分钟至表皮起皱变软。',m:7},
     {t:'下茄条一起煎 3 分钟至软塌。',m:4},
     {t:'把菜推到一边,下姜蒜末和半勺豆瓣酱炒香,下西红柿炒 2 分钟出汁。',m:3},
     {t:'加生抽 2 勺、老抽半勺、蚝油 1 勺、半勺糖和半碗水。',m:2},
     {t:'盖盖中小火焖 6 分钟,让两样菜都吸透汤汁。',m:7},
     {t:'开盖淋淀粉水收汁,加盐调味出锅。',m:2}],
 tp:'豆角要先单独煸 6 分钟。这道菜的两样主料熟得一慢一快,豆角必须抢跑,不然茄子烂成泥豆角还是生的。'},

{id:'baicaidoufudunrou',n:'白菜豆腐炖肉',e:'🥬',cat:'stew',cu:'东北',t:45,d:1,sp:0,tl:['pot'],tg:['冬天','一锅出','家常','下饭'],
 m:[{i:'baicai',q:500,u:'g'},{i:'doufu',q:400,u:'g'},{i:'wuhuarou',q:200,u:'g'}],s:[{i:'fensi',q:50,u:'g'},{i:'jiang',q:4,u:'片'}],

     {t:'锅中不放油,下五花肉片中火煎 4 分钟,把油逼出来。',m:5},
     {t:'加姜片和一颗八角炒香,加生抽 2 勺、老抽半勺、料酒。',m:2},
     {t:'下白菜帮炒 3 分钟至变软出水。',m:4},
     {t:'加开水没过食材,下豆腐块,大火烧开转中小火炖 15 分钟。',m:17},
     {t:'下白菜叶和粉丝再炖 5 分钟,加盐和胡椒粉调味出锅。',m:7}],
 tp:'用五花肉自己逼出的油炒白菜,是这道菜香的全部原因。白菜帮和叶分两次下,豆腐中途放不容易碎。'},

{id:'hongshaoyu',n:'红烧鱼',e:'🐟',cat:'stew',cu:'家常',t:40,d:3,sp:1,tl:['wok'],tg:['宴客','下饭','高蛋白'],
 m:[{i:'caoyu',q:700,u:'g'}],s:[{i:'jiang',q:6,u:'片'},{i:'cong',q:3,u:'根'},{i:'suan',q:6,u:'瓣'}],

 nu:{k:250,p:26,f:14,c:5},

     {t:'鱼身内外抹少许盐和料酒腌 10 分钟,再擦一次表面水分,薄薄拍一层干淀粉。',m:11},
     {t:'锅烧到很热再下油,油热后撒一小撮盐,下鱼。第二条件:锅热、油热、鱼干。',m:2},
     {t:'中火煎 4 分钟,不要动它,等它自己能滑动了再翻面,另一面再煎 3 分钟。',m:8},
     {t:'鱼推到锅边,下姜蒜和半勺豆瓣酱炒香。',m:2},
     {t:'加生抽 2 勺、老抽半勺、料酒 2 勺、1 勺糖、半勺醋和开水到鱼身一半高。',m:2},
     {t:'中火焖 8 分钟,中途舀汤汁浇在鱼背上。',m:9},
     {t:'把鱼盛出,汤汁淋淀粉水勾芡后浇在鱼上,撒葱丝。',m:3}],
 tp:'煎鱼不破皮的三个条件:鱼身擦到全干、锅烧到冒烟、下锅后一分钟内不要碰它。撒一小撮盐在油里也能防粘。'},

{id:'youmendaxia',n:'油焖大虾',e:'🦐',cat:'stew',cu:'鲁菜',t:25,d:2,sp:0,tl:['wok'],tg:['宴客','快手','高蛋白','低碳水'],

     {t:'热油下姜片爆香,下虾大火煎 90 秒至一面变红,翻面再煎 60 秒。',m:3},
     {t:'用铲子按压虾头,把虾脑的红油挤出来——这层红油是这道菜的灵魂,别跳过。',m:2},
     {t:'加料酒 2 勺、生抽 2 勺、1.5 勺番茄酱、1 勺糖和小半碗水。',m:2},
     {t:'盖盖中火焖 4 分钟。',m:5},
     {t:'开盖大火收汁 2 分钟至浓稠红亮,沿锅边淋几滴醋,撒葱段出锅。',m:3}],
 tp:'按压虾头挤出虾油是这道菜和"番茄酱煮虾"的分界线。虾壳虾头都不要去,鲜味和红色都来自它们。'},

{id:'suancaiyu',n:'酸菜鱼',e:'🐟',cat:'stew',cu:'川菜',t:45,d:3,sp:2,tl:['pot'],tg:['宴客','重口','高蛋白','冬天'],
 m:[{i:'caoyu',q:700,u:'g'},{i:'suancai',q:250,u:'g'}],s:[{i:'jinzhengu',q:150,u:'g'},{i:'cong',q:2,u:'根'},{i:'jiang',q:5,u:'片'}],

     {t:'鱼片用清水加少许盐抓洗两遍,洗到水变清,挤干。这步去腥去血水,鱼片才白。',m:4},
     {t:'鱼片加盐、料酒、胡椒粉、1 个蛋清、1.5 勺淀粉抓到发黏,拌油腌 15 分钟。',m:16},
     {t:'锅中少油,下鱼头鱼骨煎 3 分钟至两面金黄,加姜片和开水,大火煮 8 分钟成奶白汤,捞出骨头。',m:12},
     {t:'另锅少油炒酸菜 3 分钟出香,倒入鱼汤,下金针菇煮 3 分钟,连汤菜一起盛进大碗。',m:7},
     {t:'汤重新烧到微沸(不要滚开),鱼片一片片滑入,煮 60 秒变白立刻捞进碗里。',m:3},
     {t:'锅中烧 3 勺油,下干辣椒段和花椒炸 20 秒,连油泼在鱼片上,撒葱花白芝麻。',m:3}],
 tp:'鱼片下锅时汤只能"微沸"不能滚开,大滚会把鱼片冲散。煮 60 秒就够,鱼片薄,余温会继续加热。'},

{id:'fuzhushaorou',n:'腐竹烧肉',e:'🟡',cat:'stew',cu:'家常',t:75,d:2,sp:0,tl:['pot'],tg:['下饭','冬天','家常','高蛋白'],
 m:[{i:'wuhuarou',q:400,u:'g'},{i:'fuzhu',q:100,u:'g'}],s:[{i:'muer',q:15,u:'g'},{i:'jiang',q:4,u:'片'}],
 se:['shengchou','laochou','bingtang','liaojiu','yan','you','bajiao','guipi','haoyou'],
 nu:{k:463,p:24,f:36,c:11},
 st:[{t:'腐竹用温水泡 40 分钟至完全变软(中间没有硬芯),切段。木耳泡发。',m:42},
     {t:'五花肉切块,冷水下锅焯 3 分钟撇沫,捞出冲净。',m:7},
     {t:'锅中少油下 15g 冰糖炒糖色,下肉块翻炒上色。',m:5},
     {t:'加姜片、八角桂皮炒香,加生抽 3 勺、老抽 1 勺、蚝油 1 勺、料酒 2 勺。',m:3},
     {t:'加开水没过肉,大火烧开转小火炖 30 分钟。',m:32},
     {t:'下腐竹和木耳,加盐,继续炖 12 分钟——腐竹要炖透才好吃,会吸满肉汁。',m:13},
     {t:'转大火收汁 4 分钟出锅。',m:5}],

{id:'xiaojidunmogu',n:'小鸡炖蘑菇',e:'🍄',cat:'stew',cu:'东北',t:70,d:2,sp:0,tl:['pot'],tg:['冬天','宴客','一锅出','高蛋白'],
 m:[{i:'zhengji',q:800,u:'g'},{i:'xianggu',q:200,u:'g'}],s:[{i:'fensi',q:60,u:'g'},{i:'jiang',q:5,u:'片'},{i:'cong',q:2,u:'根'}],

 nu:{k:430,p:35,f:26,c:12},

     {t:'干香菇温水泡 30 分钟,泡菇水滤净留着——这碗水是这道菜鲜味的来源。粉丝泡软。',m:32},
     {t:'锅中少油,下 10g 冰糖炒糖色,下鸡块大火翻炒 4 分钟至上色。',m:6},
     {t:'加姜片葱段、八角、干辣椒炒香,加生抽 3 勺、老抽半勺、料酒 2 勺。',m:3},
     {t:'倒入泡菇水和开水没过鸡块,下香菇,大火烧开转小火炖 35 分钟。',m:37},
     {t:'加盐调味,下粉丝再煮 5 分钟(粉丝吸汤,别太早放)。',m:6},
     {t:'撒胡椒粉和葱花出锅。',m:1}],

{id:'paigudunou',n:'排骨炖藕',e:'🪷',cat:'stew',cu:'湖北',t:85,d:1,sp:0,tl:['pot'],tg:['冬天','养胃','一锅出','高蛋白'],

     {t:'排骨冷水下锅,加姜片和料酒,大火烧开撇净浮沫。',m:6},
     {t:'转小火炖 40 分钟,不要盖严,留一条缝。',m:41},
     {t:'下藕块和一颗八角,继续小火炖 25 分钟至藕变粉糯。',m:26},
     {t:'关火前加盐和胡椒粉调味,撒葱花。',m:2}],
 tp:'盐一定最后放。早放盐蛋白质会提前凝固,肉炖不烂汤也不白。这道菜清炖不加酱油,喝的就是排骨和藕的本味。'},

     {t:'加 4 碗水烧开,加盐和半勺糖,煮 2 分钟。',m:3},
     {t:'淋少许淀粉水让汤微微浓稠,这样蛋花能悬在汤里不沉底。',m:1},
     {t:'关小火,汤微沸时把蛋液高高地、细细地转圈淋入,静待 5 秒再推动,蛋花就是絮状的。',m:1},
     {t:'滴香油,撒葱花和胡椒粉。',m:1}],
 tp:'蛋花漂亮的三个条件:汤要微沸不能大滚、蛋液要举高细淋、淋完等 5 秒再搅。搅早了就是一锅蛋渣。'},

{id:'zicaidanhuatang',n:'紫菜蛋花汤',e:'🌿',cat:'soup',cu:'家常',t:8,d:1,sp:0,tl:['pot'],tg:['快手','低卡','极简','减脂','新手友好'],
 m:[{i:'zicai',q:10,u:'g'},{i:'jidan',q:2,u:'个'}],s:[{i:'xiapi',q:5,u:'g'},{i:'cong',q:1,u:'根'}],

     {t:'锅中 4 碗水烧开,下虾皮煮 2 分钟出鲜味。',m:3},
     {t:'加盐和几滴生抽调味。',m:1},
     {t:'转小火保持微沸,蛋液举高细细淋入,等 5 秒后轻推成絮。',m:1},

{id:'siguadantang',n:'丝瓜蛋汤',e:'🥒',cat:'soup',cu:'家常',t:12,d:1,sp:0,tl:['pot'],tg:['快手','低卡','夏天','减脂'],

     {t:'加 4 碗开水,大火煮 3 分钟至丝瓜变透明软烂。',m:4},
     {t:'加盐调味,转小火淋入蛋液推成蛋花。',m:1},

{id:'dongguapaigutang',n:'冬瓜排骨汤',e:'🥒',cat:'soup',cu:'家常',t:75,d:1,sp:0,tl:['pot'],tg:['低卡','减脂','夏天','养胃','高蛋白'],

     {t:'转小火炖 35 分钟,锅盖留缝。',m:36},

{id:'yumipaigutang',n:'玉米排骨汤',e:'🌽',cat:'soup',cu:'家常',t:80,d:1,sp:0,tl:['pot'],tg:['养胃','孩子爱吃','高蛋白','一锅出'],

     {t:'排骨冷水下锅加姜片料酒,大火烧开撇净浮沫。',m:7},
     {t:'转小火炖 35 分钟。',m:36},
     {t:'下玉米段和胡萝卜块,继续炖 20 分钟。',m:21},
     {t:'关火前加盐和胡椒粉调味。',m:2}],

     {t:'锅中油下洋葱炒 3 分钟至透明,下西红柿中火炒 6 分钟至完全出沙。',m:10},

{id:'yinerlianzigeng',n:'银耳莲子羹',e:'🤍',cat:'soup',cu:'家常',t:75,d:1,sp:0,tl:['pot'],tg:['甜品','养生','素菜','养胃'],

{id:'qingdunjitang',n:'清炖鸡汤',e:'🐔',cat:'soup',cu:'家常',t:100,d:1,sp:0,tl:['pot'],tg:['养胃','冬天','高蛋白','养生'],

     {t:'转最小火,保持汤面"似开非开"的微沸状态,炖 70 分钟。',m:71},

/* ==========================================================================
   第 3 层 · 状态与持久化
   纪律:所有状态变更必须走 set() / save(),不允许改完 DOM 再改 state
   ========================================================================== */

var LSKEY = 'eatwhat_v1';

/* 探测本地存储可用性。某些环境(Safari 隐私模式、data: 源、
   部分浏览器的 file:// 策略)会禁用 localStorage —— 这时应用照常可用,
   但刷新后会忘记,必须明确告诉用户,不能让数据静默消失。 */
var STORAGE_OK = (function(){
  try{ localStorage.setItem('__ew_probe','1'); localStorage.removeItem('__ew_probe'); return true; }
  catch(e){ return false; }
})();

function defPrefs(){
  var tl=[]; for(var i=0;i<TOOLS.length;i++) if(TOOLS[i].def) tl.push(TOOLS[i].id);
  return {servings:3, goal:'balance', kcalCap:null, avoid:[], vegetarian:false,
          halal:false, maxSpicy:3, tools:tl, staples:true, ignoreTools:false};
}

var S = {
  /* 持久化 */
  selected:[], inventory:[], prefs:defPrefs(), favs:[], history:[], today:[], weekPlan:null,
  /* 会话内 */
  tab:'pick', pickCat:'hot', q:'', sort:'match', roll:null, rolled:[], dayPlan:null,
  openId:null, cookId:null, cookStep:0, timer:null, timerLeft:0, wakeLock:null, shopDone:{}
};

function save(){
  try{
    localStorage.setItem(LSKEY, JSON.stringify({
      selected:S.selected, inventory:S.inventory, prefs:S.prefs,
      favs:S.favs, history:S.history, today:S.today, weekPlan:S.weekPlan
    }));
  }catch(e){ /* 隐私模式或配额满,静默降级为会话内可用 */ }
}

function load(){
  try{
    var raw = localStorage.getItem(LSKEY); if(!raw) return;
    var d = JSON.parse(raw); if(!d) return;
    if(Array.isArray(d.selected))  S.selected  = d.selected;
    if(Array.isArray(d.inventory)) S.inventory = d.inventory;
    if(Array.isArray(d.favs))      S.favs      = d.favs;
    if(Array.isArray(d.history))   S.history   = d.history;
    if(Array.isArray(d.today))     S.today     = d.today;
    if(d.weekPlan)                 S.weekPlan  = d.weekPlan;
    if(d.prefs){ var p=defPrefs(); for(var k in p) if(d.prefs[k]!==undefined) p[k]=d.prefs[k]; S.prefs=p; }
  }catch(e){}
}

/* ==========================================================================
   第 4 层 · 工具函数
   ========================================================================== */

var $ = function(s){ return document.querySelector(s); };
var DAY = 86400000;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function ingOf(id){ return IMAP[id]; }
function nameOf(id){ var g=IMAP[id]; return g?g.n:id; }
function emojiOf(id){ var g=IMAP[id]; return g?g.e:'•'; }
function recOf(id){ for(var i=0;i<RECIPES.length;i++) if(RECIPES[i].id===id) return RECIPES[i]; return null; }
function inArr(a,v){ return a.indexOf(v)>=0; }
function toggleArr(a,v){ var i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); return a; }
function todayStamp(){ var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }

/* 库存剩余天数 */
function remainDays(it){
  if(it.days>=365) return 999;
  return it.days - Math.floor((Date.now()-it.addedAt)/DAY);
}
function invState(it){
  var r=remainDays(it);
  if(r<=0) return 'expired';
  if(r<=2) return 'near';
  return 'ok';
}

/* 份数换算:qty 以 3 人份存储 */
function scaleQty(q,u,servings){
  var v = q*servings/3;
  if(u==='g'||u==='ml'){
    if(v<10) return Math.max(1, Math.round(v));
    return Math.round(v/5)*5;
  }
  var r = Math.round(v*2)/2;
  return r<0.5 ? 0.5 : r;
}
function fmtQty(n){
  if(n===Math.floor(n)) return String(n);
  return String(Math.round(n*10)/10);
}
function qtyText(item,servings){
  return fmtQty(scaleQty(item.q,item.u,servings)) + item.u;
}

/* 替代方案 */
function subFor(rec,id){
  if(rec && rec.sb && rec.sb[id]) return rec.sb[id];
  return SUBS[id] || '';
}

function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },1900);
}

/* ==========================================================================
   第 5 层 · 匹配算法(PRD §6)
   ========================================================================== */

/* 某食材是否"手上有":本次勾选 或 调味基础包覆盖 */
function buildHave(){
  var sel={}; for(var i=0;i<S.selected.length;i++) sel[S.selected[i]]=1;
  var st=S.prefs.staples;
  return function(id){ return !!sel[id] || (st && !!PACK[id]); };
}

/* 已勾选且临期的食材集合 */
function buildNear(){
  var near={};
  for(var i=0;i<S.inventory.length;i++){
    var it=S.inventory[i], st=invState(it);
    if(st==='near'||st==='expired') near[it.ing]=1;
  }
  return near;
}

/* 荤素判定:主料或辅料里有动物性食材(蛋奶不计) */
function isMeaty(r){
  var a=r.m.concat(r.s);
  for(var i=0;i<a.length;i++){ var g=IMAP[a[i].i]; if(g&&g.an) return true; }
  return false;
}
function hasPork(r){
  var a=r.m.concat(r.s);
  for(var i=0;i<a.length;i++){ var g=IMAP[a[i].i]; if(g&&g.an==='pork') return true; }
  return false;
}

function match(){
  var have = buildHave();
  var near = buildNear();
  var sel  = {}; for(var i=0;i<S.selected.length;i++) sel[S.selected[i]]=1;
  var avoid= {}; for(i=0;i<S.prefs.avoid.length;i++) avoid[S.prefs.avoid[i]]=1;
  var tools= {}; for(i=0;i<S.prefs.tools.length;i++) tools[S.prefs.tools[i]]=1;
  var fav  = {}; for(i=0;i<S.favs.length;i++) fav[S.favs[i]]=1;
  var last = {};
  for(i=0;i<S.history.length;i++){ var h=S.history[i]; if(!last[h.id]||h.at>last[h.id]) last[h.id]=h.at; }

  var P=S.prefs, now=Date.now(), out=[], hiddenTool=0, hiddenAvoid=0;

  /* 零输入保护:一样都没勾时不做推荐。
     不加这个判断的话,所有「单主料 + 全基础包调味」的菜会因为
     missMain=1 / missTotal=1 恰好落进 Tier 1,显示成"差 1 样:南瓜"——
     用户什么都没选,说"差一样"是误导。这种情况应该走引导页。 */
  if(!S.selected.length) return {list:[], hiddenTool:0, hiddenAvoid:0, noInput:true};

  for(var ri=0; ri<RECIPES.length; ri++){
    var r=RECIPES[ri], k;

    /* ---- 硬过滤 ---- */
    var all=r.m.concat(r.s), bad=false;
    for(k=0;k<all.length;k++) if(avoid[all[k].i]){ bad=true; break; }
    if(!bad) for(k=0;k<r.se.length;k++) if(avoid[r.se[k]]){ bad=true; break; }
    if(bad){ hiddenAvoid++; continue; }

    if(P.vegetarian && isMeaty(r)) continue;
    if(P.halal && (hasPork(r) || inArr(r.se,'liaojiu'))) continue;
    if(r.sp > P.maxSpicy) continue;
    if(P.kcalCap && r.nu.k > P.kcalCap) continue;

    if(!P.ignoreTools){
      var lackTool=false;
      for(k=0;k<r.tl.length;k++) if(!tools[r.tl[k]]){ lackTool=true; break; }
      if(lackTool){ hiddenTool++; continue; }
    }

    /* ---- 缺料计算 ---- */
    var missMain=[], missSub=[], missSeason=[], usedSel=0, nearHit=[];
    for(k=0;k<r.m.length;k++){
      var mi=r.m[k];
      if(!have(mi.i)) missMain.push(mi.i);
      else { if(sel[mi.i]) usedSel++; if(sel[mi.i]&&near[mi.i]) nearHit.push(mi.i); }
    }
    for(k=0;k<r.s.length;k++){
      var si=r.s[k];
      if(!have(si.i)) missSub.push(si.i);
      else { if(sel[si.i]) usedSel++; if(sel[si.i]&&near[si.i]) nearHit.push(si.i); }
    }
    for(k=0;k<r.se.length;k++) if(!have(r.se[k])) missSeason.push(r.se[k]);

    var missTotal = missMain.length+missSub.length+missSeason.length;
    var mainRatio = r.m.length ? (r.m.length-missMain.length)/r.m.length : 1;
    var subRatio  = r.s.length ? (r.s.length-missSub.length)/r.s.length  : 1;

    /* ---- 分档 ---- */
    var tier;
    if(missTotal===0) tier=0;
    else if(missTotal<=2 && missMain.length<=1) tier=1;
    else if(mainRatio>=0.5) tier=2;
    else continue;

    /* ---- 打分 ---- */
    var sc = 100 + 40*mainRatio + 15*subRatio;
    sc += 25 * (usedSel / Math.max(1,S.selected.length));
    sc += 8 * nearHit.length;
    if(fav[r.id]) sc += 15;
    sc -= 6 * missTotal;
    if(last[r.id]){
      var ago=(now-last[r.id])/DAY;
      if(ago<=7) sc -= 30; else if(ago<=30) sc -= 10;
    }
    if(r.t>60) sc -= 5;

    /* 营养目标专项加权 */
    var nu=r.nu;
    if(P.goal==='cut'){
      sc += (nu.p*4/Math.max(1,nu.k))*120;
      sc += (nu.k<=450 ? 12 : -15);
    }else if(P.goal==='bulk'){
      sc += nu.p*1.6;
      if(nu.p>=20) sc += 12;
    }else if(P.goal==='lowcarb'){
      sc += (nu.c<=20 ? 14 : -(nu.c-20)*0.8);
      if(r.cat==='staple') sc -= 18;
    }

    out.push({r:r, tier:tier, score:sc, missMain:missMain, missSub:missSub,
              missSeason:missSeason, missTotal:missTotal, nearHit:nearHit});
  }

  /* ---- 排序 ---- */
  var cmp;
  if(S.sort==='kcal')      cmp=function(a,b){ return a.r.nu.k-b.r.nu.k; };
  else if(S.sort==='time') cmp=function(a,b){ return a.r.t-b.r.t; };
  else if(S.sort==='prot') cmp=function(a,b){ return b.r.nu.p-a.r.nu.p; };
  else                     cmp=function(a,b){ return b.score-a.score; };
  out.sort(function(a,b){ return (a.tier-b.tier) || cmp(a,b); });

  return {list:out, hiddenTool:hiddenTool, hiddenAvoid:hiddenAvoid};
}

/* ---------- 存储不可用提示 ---------- */
function storageBar(){
  if(STORAGE_OK) return '';
  return '<div class="alertbar" style="border-color:var(--danger);color:#7A2B22">'
   + '<b>这个环境不让保存数据。</b>应用能正常用,但刷新页面后勾选、库存和偏好都会丢。'

/* ---------- 临期提醒条 ---------- */
function alertBar(){
  var near=[], exp=[];
  for(var i=0;i<S.inventory.length;i++){
    var it=S.inventory[i], st=invState(it);
    if(st==='expired') exp.push(nameOf(it.ing));
    else if(st==='near') near.push(nameOf(it.ing));
  }

  var s='<div class="alertbar">';

  if(near.length) s+='<b>快坏了:</b>'+esc(near.join('、'))+' —— 推荐里会优先给能消耗它们的菜。';
  s+='</div>';
  return s;
}

/* ---------- Tab 1:选食材 ----------
   关键约束:搜索框必须留在「静态区」,绝对不能在 input 事件里被重建。
   中文拼音输入法靠 composition 组字会话逐字成词,一旦 <input> 元素
   被销毁重建,组字会话立刻中断 —— 表现就是「打不出中文」。
   所以输入时只重绘 #pickBody,搜索框本身一动不动。 */
function viewPick(){
  var h='', i;
  h+=storageBar();
  h+=alertBar();

  /* --- 静态区:搜索框(勿在 input 里重建) --- */
  h+='<div class="searchwrap"><span class="mg">🔍</span>'
   + '<input id="q" type="search" enterkeyhint="search"'
   + ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"'
   + ' placeholder="搜食材,拼音也行(tudou)" value="'+esc(S.q)+'">'
   + '<button class="clr" id="qclr" style="display:'+(S.q?'':'none')+'">✕</button></div>';

  /* --- 已选 chip 条(独立容器,便于局部重绘) --- */
  h+='<div id="chipWrap">'+chipBar()+'</div>';

  h+='<div id="pickBody">'+pickBody()+'</div>';

function chipBar(){

function ctaText(){
  var mm=match(), n0=0;
  for(var i=0;i<mm.list.length;i++) if(mm.list[i].tier===0) n0++;
  return '看看能做什么 · 现在能做 '+n0+' 道';
}

/* 搜索匹配:中文名 / 别名 / 拼音(食材 id 本身就是无声调拼音)
   打分排序,让前缀命中排在包含命中前面 */
function searchIng(q){
  var out=[], i, a;
  for(i=0;i<ING.length;i++){
    var g=ING[i], sc=-1;
    if(g.n.indexOf(q)===0)      sc=100;   /* 中文名前缀 */
    else if(g.n.indexOf(q)>0)   sc=90;    /* 中文名包含 */
    else if(g.id.indexOf(q)===0)sc=80;    /* 拼音前缀,如 tudou */
    if(sc<0 && g.al){
      for(a=0;a<g.al.length;a++){
        if(g.al[a].indexOf(q)===0){ sc=70; break; }
        if(g.al[a].indexOf(q)>0){   sc=60; break; }
      }
    }
    if(sc<0 && g.id.indexOf(q)>0) sc=40;  /* 拼音中段命中,权重最低 */
    if(sc>=0) out.push({g:g,s:sc});
  }
  out.sort(function(x,y){ return y.s-x.s; });
  var list=[];
  for(i=0;i<out.length;i++) list.push(out[i].g);
  return list;
}

function pickBody(){
  var h='', i;
  var q=S.q.trim().toLowerCase();

  /* 分类导航(搜索时隐藏) */
  if(!q){
    h+='<div class="catnav">';
    for(i=0;i<CATS.length;i++){
      h+='<button data-pcat="'+CATS[i].id+'" class="'+(S.pickCat===CATS[i].id?'on':'')+'">'+CATS[i].name+'</button>';
    }
    h+='</div>';
  }

  /* 食材列表 */
  var list=[];
  if(q){
    list=searchIng(q);
  }else if(S.pickCat==='hot'){
    for(i=0;i<ING.length;i++) if(ING[i].hot) list.push(ING[i]);
  }else{
    for(i=0;i<ING.length;i++) if(ING[i].cat===S.pickCat) list.push(ING[i]);
  }

  if(q){
    h+='<div class="hint" style="margin-bottom:10px">搜到 <b>'+list.length+'</b> 项'
     + (list.length?' —— 点一下就选上':'')+'</div>';
  }else if(S.pickCat==='season'){
    h+='<div class="hint" style="margin-bottom:10px">调味基础包'+(S.prefs.staples?'<b>已开启</b>':'已关闭')
     + ':盐油糖、生抽老抽醋、料酒、葱姜蒜、淀粉、蚝油、冰糖、八角花椒等默认算你都有,不计入缺料。'
     + '下面标「已有」的就是包内的。可以在「我的」里关掉改成严格模式。</div>';
  }

  if(!list.length){
    h+='<div class="empty"><div class="big">🔍</div><h3>没找到「'+esc(S.q)+'」</h3>'
     + '<p>试试更短的词,或者用拼音(比如 <b>tudou</b>、<b>xihongshi</b>),也可以直接在分类里翻。</p></div>';
    return h;
  }

  var inv={}; for(i=0;i<S.inventory.length;i++) inv[S.inventory[i].ing]=S.inventory[i];
  var selm={}; for(i=0;i<S.selected.length;i++) selm[S.selected[i]]=1;
  h+='<div class="ings">';
  for(i=0;i<list.length;i++){
    var g2=list[i], on=selm[g2.id], badge='';
    if(inv[g2.id]){
      var st=invState(inv[g2.id]), rd=remainDays(inv[g2.id]);
      if(st==='expired')   badge='<span class="badge danger">过期</span>';
      else if(st==='near') badge='<span class="badge warn">'+rd+'天</span>';
      else                 badge='<span class="badge inv">有</span>';
    }else if(g2.pk && S.prefs.staples){
      badge='<span class="badge inv">已有</span>';
    }
    h+='<button class="ing '+(on?'on':'')+'" data-ing="'+g2.id+'">'+badge
     + '<em>'+g2.e+'</em><b>'+esc(g2.n)+'</b></button>';
  }
  h+='</div>';
  return h;
}

/* ---------- 菜卡 ---------- */
function dishCard(x){

  h+='<button class="dish" data-open="'+r.id+'">';
  h+='<span class="viz" data-cat="'+r.cat+'">'+r.e+'</span>';
  h+='<span class="body">';

  h+='<span class="meta">'
   + '<span class="tag">'+DCATS[r.cat]+'</span>'

/* ---------- Tab 4:买菜清单 ---------- */
function buildShop(){
  var have=buildHave(), acc={}, order=[], kcal=0, names=[];
  for(var i=0;i<S.today.length;i++){
    var r=recOf(S.today[i]); if(!r) continue;
    names.push(r.n); kcal += r.nu.k*S.prefs.servings;
    var items=r.m.concat(r.s);
    for(var j=0;j<items.length;j++){
      var it=items[j]; if(have(it.i)) continue;
      var key=it.i+'|'+it.u;
      if(!acc[key]){ acc[key]={ing:it.i,unit:it.u,qty:0,from:[]}; order.push(key); }
      acc[key].qty += scaleQty(it.q,it.u,S.prefs.servings);
      if(acc[key].from.indexOf(r.n)<0) acc[key].from.push(r.n);
    }
    for(j=0;j<r.se.length;j++){
      var sid=r.se[j]; if(have(sid)) continue;
      var k2=sid+'|适量';
      if(!acc[k2]){ acc[k2]={ing:sid,unit:'适量',qty:0,from:[]}; order.push(k2); }
      if(acc[k2].from.indexOf(r.n)<0) acc[k2].from.push(r.n);
    }
  }
  var rows=[]; for(i=0;i<order.length;i++) rows.push(acc[order[i]]);
  rows.sort(function(a,b){
    var ca=IMAP[a.ing]?IMAP[a.ing].cat:'zz', cb=IMAP[b.ing]?IMAP[b.ing].cat:'zz';
    return ca<cb?-1:(ca>cb?1:0);
  });
  return {rows:rows, kcal:kcal, names:names};
}

function shopText(){
  var d=buildShop(), byCat={}, ord=[];
  for(var i=0;i<d.rows.length;i++){
    var row=d.rows[i], g=IMAP[row.ing], cn='其他';
    if(g) for(var c=0;c<CATS.length;c++) if(CATS[c].id===g.cat) cn=CATS[c].name;
    if(!byCat[cn]){ byCat[cn]=[]; ord.push(cn); }
    byCat[cn].push(nameOf(row.ing)+' '+(row.unit==='适量'?'适量':fmtQty(row.qty)+row.unit));
  }
  var s='买菜清单（'+d.names.join('、')+'，'+S.prefs.servings+'人份）\n';
  for(i=0;i<ord.length;i++) s+='\n【'+ord[i]+'】\n'+byCat[ord[i]].join('\n')+'\n';
  return s;
}

/* iOS 上 body{overflow:hidden} 锁不住滚动,必须 position:fixed + 记住偏移 */
var LOCK_Y=0;
function lockScroll(on){
  var b=document.body;
  if(on){
    if(b.style.position==='fixed') return;
    LOCK_Y=window.scrollY||window.pageYOffset||0;
    b.style.position='fixed'; b.style.top=(-LOCK_Y)+'px';
    b.style.left='0'; b.style.right='0'; b.style.width='100%';
  }else{
    if(b.style.position!=='fixed') return;
    b.style.position=''; b.style.top=''; b.style.left=''; b.style.right=''; b.style.width='';
    window.scrollTo(0,LOCK_Y);
  }
}

/* ---------- 一周菜单抽屉 ---------- */
function openWeek(){
  var mm=match(), pool=[];
  for(var i=0;i<mm.list.length;i++) if(mm.list[i].tier<=1) pool.push(mm.list[i].r);
  if(pool.length<6) for(i=0;i<mm.list.length;i++) if(mm.list[i].tier===2) pool.push(mm.list[i].r);

  var meaty=[], veg=[];
  for(i=0;i<pool.length;i++) (isMeaty(pool[i])?meaty:veg).push(pool[i]);
  shuffle(meaty); shuffle(veg);

  var days=['周一','周二','周三','周四','周五','周六','周日'], plan=[], used={};
  function take(arr){ for(var j=0;j<arr.length;j++) if(!used[arr[j].id]){ used[arr[j].id]=1; return arr[j]; } return null; }
  for(i=0;i<7;i++) plan.push({d:days[i], a:take(meaty), b:take(veg)});
  S.weekPlan=plan; save();

  var h='<div class="hint" style="margin-bottom:12px">每天一荤一素,一周内不重复。'
   + '菜是从你现有食材能做的范围里挑的,所以基本都能直接做。</div><div class="plan">';
  var kcal=0, ids=[];
  for(i=0;i<plan.length;i++){
    var p=plan[i];
    h+='<div class="planrow"><span class="slot">'+p.d+'</span><span class="nm">';
    if(p.a){ h+='<b>'+p.a.e+' '+esc(p.a.n)+'</b>'; kcal+=p.a.nu.k; ids.push(p.a.id); }
    if(p.b){ h+='<span>'+p.b.e+' '+esc(p.b.n)+'</span>'; kcal+=p.b.nu.k; ids.push(p.b.id); }
    if(!p.a&&!p.b) h+='<span class="muted">候选不够了,再多勾几样食材</span>';
    h+='</span></div>';
  }
  h+='</div><div class="hint" style="margin-top:12px">共 '+ids.length+' 道,平均每人每天约 '
   + (ids.length?Math.round(kcal/7):0)+' kcal(只算这两道菜,不含主食)。</div>';
  openSheet('一周菜单', h,
    '<button class="btn plain" id="wkRe">重新生成</button><button class="btn" id="wkShop">缺料合并进清单</button>');
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

   第 8 层 · 摆一摆 / 配一桌
   ========================================================================== */

function doRoll(){
  var mm=match(), pool=[];
  for(var i=0;i<mm.list.length;i++) if(mm.list[i].tier===0) pool.push(mm.list[i].r);
  if(!pool.length) for(i=0;i<mm.list.length;i++) if(mm.list[i].tier===1) pool.push(mm.list[i].r);
  if(!pool.length) for(i=0;i<mm.list.length;i++) pool.push(mm.list[i].r);
  if(!pool.length){ toast('先去勾几样食材'); go('pick'); return; }

  var fresh=[]; for(i=0;i<pool.length;i++) if(!inArr(S.rolled,pool[i].id)) fresh.push(pool[i]);
  if(!fresh.length){
    /* 候选耗尽:清空记录重新开始,但保留刚摆出的那道,
       否则重置后可能立刻又摆到同一道,看起来像坏了 */
    S.rolled = S.roll ? [S.roll] : [];
    fresh=[]; for(i=0;i<pool.length;i++) if(!inArr(S.rolled,pool[i].id)) fresh.push(pool[i]);
    if(!fresh.length) fresh=pool;   /* 池子里真的只剩一道菜 */
  }
  var pick=fresh[Math.floor(Math.random()*fresh.length)];
  S.rolled.push(pick.id); S.roll=pick.id; S.tab='dish';
  render();
  var b=$('#rollBox'); if(b){ b.classList.add('spin'); setTimeout(function(){ b.classList.remove('spin'); },430); }
  window.scrollTo(0,0);
}

function doDayPlan(){
  var mm=match(), pool=[];
  for(var i=0;i<mm.list.length;i++) if(mm.list[i].tier<=1) pool.push(mm.list[i].r);
  if(pool.length<3) for(i=0;i<mm.list.length;i++) if(mm.list[i].tier===2) pool.push(mm.list[i].r);
  if(pool.length<2){ toast('可做的菜太少,先多勾几样食材'); go('pick'); return; }

  var meaty=[], veg=[], soupy=[];
  for(i=0;i<pool.length;i++){
    var r=pool[i];
    if(r.cat==='soup'||r.cat==='staple') soupy.push(r);
    else if(isMeaty(r)) meaty.push(r);
    else veg.push(r);
  }
  shuffle(meaty); shuffle(veg); shuffle(soupy);
  var ids=[], used={};
  function pick(arr,fb){
    var a=arr.length?arr:fb;
    for(var j=0;j<a.length;j++) if(!used[a[j].id]){ used[a[j].id]=1; return a[j].id; }
    return null;
  }
  var a1=pick(meaty,pool), a2=pick(veg,pool), a3=pick(soupy,pool);
  if(a1) ids.push(a1); if(a2) ids.push(a2); if(a3) ids.push(a3);
  var kcal=0; for(i=0;i<ids.length;i++){ var rr=recOf(ids[i]); if(rr) kcal+=rr.nu.k*S.prefs.servings; }
  S.dayPlan={ids:ids, kcal:kcal}; S.tab='dish'; render(); window.scrollTo(0,0);
}

function swapPlanSlot(idx){
  if(!S.dayPlan) return;
  var mm=match(), pool=[];
  for(var i=0;i<mm.list.length;i++) if(mm.list[i].tier<=1) pool.push(mm.list[i].r);
  if(pool.length<3) for(i=0;i<mm.list.length;i++) if(mm.list[i].tier===2) pool.push(mm.list[i].r);
  var cur=S.dayPlan.ids[idx], curR=recOf(cur), cand=[];
  for(i=0;i<pool.length;i++){
    var r=pool[i]; if(inArr(S.dayPlan.ids,r.id)) continue;
    var same;
    if(idx===2) same=(r.cat==='soup'||r.cat==='staple');
    else if(idx===0) same=isMeaty(r)&&r.cat!=='soup'&&r.cat!=='staple';
    else same=!isMeaty(r)&&r.cat!=='soup'&&r.cat!=='staple';
    if(same) cand.push(r);
  }
  if(!cand.length){ toast('这一类没有别的候选了'); return; }
  S.dayPlan.ids[idx]=cand[Math.floor(Math.random()*cand.length)].id;
  var kcal=0; for(i=0;i<S.dayPlan.ids.length;i++){ var rr=recOf(S.dayPlan.ids[i]); if(rr) kcal+=rr.nu.k*S.prefs.servings; }
  S.dayPlan.kcal=kcal; render();
}

function fmtClock(s){
  if(s<0) s=0;
  var m=Math.floor(s/60), x=s%60;
  return m+':'+(x<10?'0':'')+x;
}
function startTimer(sec){
  stopTimer(); S.timerLeft=sec;
  S.timer=setInterval(function(){
    S.timerLeft--;
    var el=$('#tmNum'); if(el) el.textContent=fmtClock(S.timerLeft);
    if(S.timerLeft<=0){ stopTimer(); beep(); flashTitle(); renderCook(); toast('时间到'); }
  },1000);
  renderCook();
}
function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }

/* iOS 必须在用户手势里创建/恢复 AudioContext,否则计时结束时静默无声。
   所以「开始计时」那一下点击就把它备好并复用。 */
var AUDIO=null;
function ensureAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    if(!AUDIO) AUDIO=new AC();
    if(AUDIO.state==='suspended' && AUDIO.resume) AUDIO.resume();
    return AUDIO;
  }catch(e){ return null; }
}
function beep(){
  try{
    var ctx=ensureAudio(); if(!ctx) return;
    for(var k=0;k<3;k++){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; o.type='sine';
      var t0=ctx.currentTime+k*0.35;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(0.3,t0+0.02);
      g.gain.linearRampToValueAtTime(0,t0+0.25);
      o.start(t0); o.stop(t0+0.3);
    }
  }catch(e){}
}
function flashTitle(){
  var old=document.title, n=0;
  var iv=setInterval(function(){
    document.title = (n%2 ? '⏰ 时间到!' : old); n++;
    if(n>10){ clearInterval(iv); document.title=old; }
  },600);
}
function requestWake(){
  try{
    if(navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(w){ S.wakeLock=w; }).catch(function(){});
    }
  }catch(e){}
}
function releaseWake(){ try{ if(S.wakeLock){ S.wakeLock.release(); S.wakeLock=null; } }catch(e){} }

/* ==========================================================================
   第 10 层 · 事件绑定(统一委托)
   ========================================================================== */

function closest(el,attr){
  while(el && el!==document.body){
    if(el.getAttribute && el.getAttribute(attr)!==null) return el;
    el=el.parentNode;
  }
  return null;
}

document.addEventListener('click', function(ev){
  var t=ev.target, el;

  /* --- Tab --- */
  if((el=closest(t,'data-tab'))){ go(el.getAttribute('data-tab')); return; }

  /* --- 选食材 --- */
  if((el=closest(t,'data-ing'))){
    toggleArr(S.selected, el.getAttribute('data-ing')); save();
    if(S.tab==='pick'){
      /* 只改这一格的选中态 + 刷新 chip 条和 CTA。
         整页重绘会重建 #q,导致手机键盘收起、焦点丢失 —— 搜一样点一样时非常难用 */
      el.classList.toggle('on');
      refreshAfterPick();
    } else render();
    return;
  }
  if((el=closest(t,'data-unsel'))){
    toggleArr(S.selected, el.getAttribute('data-unsel')); save();
    if(S.tab==='pick'){ refreshChips(); refreshPick(); refreshCta(); renderTabs(); }
    else render();
    return;
  }
  if((el=closest(t,'data-pcat'))){
    S.pickCat=el.getAttribute('data-pcat');
    if(S.tab==='pick') refreshPick(); else render();
    return;
  }
  if(t.id==='qclr'){
    S.q=''; var qi=$('#q'); if(qi){ qi.value=''; qi.focus(); }
    refreshPick(); return;
  }
  if(t.id==='clrSel'){
    S.selected=[]; save();
    if(S.tab==='pick'){ refreshChips(); refreshPick(); refreshCta(); renderTabs(); } else render();
    return;
  }
  if(t.id==='goDish'){ go('dish'); return; }
  if(t.id==='toPick'){ go('pick'); return; }
  if(t.id==='toDish'){ go('dish'); return; }
  if(t.id==='fromInv' || t.id==='invToSel'){
    var n=0;
    for(var i=0;i<S.inventory.length;i++){
      var id=S.inventory[i].ing;
      if(!inArr(S.selected,id)){ S.selected.push(id); n++; }
    }
    save(); S.tab = (t.id==='invToSel') ? 'dish' : S.tab; render();
    toast(n?('带入 '+n+' 样'):'库存里的都已经选上了'); return;
  }

  /* --- 推荐页 --- */
  if((el=closest(t,'data-sort'))){ S.sort=el.getAttribute('data-sort'); render(); return; }
  if(t.id==='btnRoll' || t.id==='btnRoll2' || t.id==='rollAgain'){ doRoll(); return; }
  if(t.id==='btnDay'){ doDayPlan(); return; }
  if(t.id==='btnWeek'){ openWeek(); return; }
  if(t.id==='planClose'){ S.dayPlan=null; render(); return; }
  if(t.id==='planAdd'){
    if(S.dayPlan){
      for(i=0;i<S.dayPlan.ids.length;i++) if(!inArr(S.today,S.dayPlan.ids[i])) S.today.push(S.dayPlan.ids[i]);
      save(); toast('整桌已加入清单'); render();
    }
    return;
  }
  if((el=closest(t,'data-swap'))){ swapPlanSlot(parseInt(el.getAttribute('data-swap'),10)); return; }
  if(t.id==='ignTool'){ S.prefs.ignoreTools=true; save(); render(); toast('已忽略厨具限制'); return; }

  /* --- 详情 --- */
  if((el=closest(t,'data-open'))){ openRecipe(el.getAttribute('data-open')); return; }
  if(t.id==='sheetClose' || t.id==='scrim' || t.id==='sfDone'){ closeSheet(); render(); return; }
  if((el=closest(t,'data-sv'))){
    S.prefs.servings=parseInt(el.getAttribute('data-sv'),10); save();
    if(S.openId) openRecipe(S.openId); else render();
    return;
  }
  if(t.id==='sfFav'){
    if(S.openId){ toggleArr(S.favs,S.openId); save(); toast(inArr(S.favs,S.openId)?'已收藏':'已取消收藏'); openRecipe(S.openId); }
    return;
  }
  if(t.id==='sfToday'){
    if(S.openId){
      if(inArr(S.today,S.openId)){ toggleArr(S.today,S.openId); toast('已从清单移除'); }
      else { S.today.push(S.openId); toast('已加入今天做'); }
      save(); openRecipe(S.openId); renderTabs();
    }
    return;
  }
  if(t.id==='sfCook'){ var oid=S.openId; closeSheet(); openCook(oid); return; }

  /* --- 库存 --- */
  if(t.id==='invAdd'){ openInvAdd(null); return; }
  if((el=closest(t,'data-invpick'))){ openInvAdd(el.getAttribute('data-invpick')); return; }
  if((el=closest(t,'data-invref'))){ openInvAdd(el.getAttribute('data-invref')); return; }
  if((el=closest(t,'data-day'))){
    var parts=el.getAttribute('data-day').split('|'), d=parseInt(parts[0],10), ing=parts[1];
    var found=false;
    for(i=0;i<S.inventory.length;i++) if(S.inventory[i].ing===ing){ S.inventory[i].days=d; S.inventory[i].addedAt=Date.now(); found=true; }
    if(!found) S.inventory.push({ing:ing, addedAt:Date.now(), days:d});
    if(!inArr(S.selected,ing)) S.selected.push(ing);
    save(); closeSheet(); render();
    toast(nameOf(ing)+' 已记入库存');
    return;
  }
  if((el=closest(t,'data-invdel'))){
    var did=el.getAttribute('data-invdel');
    for(i=S.inventory.length-1;i>=0;i--) if(S.inventory[i].ing===did) S.inventory.splice(i,1);
    save(); render(); return;
  }
  if(t.id==='invClear'){
    if(confirm('清空整个库存?本次勾选的食材不受影响。')){ S.inventory=[]; save(); render(); }
    return;
  }

  /* --- 购物清单 --- */
  if((el=closest(t,'data-shop'))){
    var key=el.getAttribute('data-shop');
    if(S.shopDone[key]) delete S.shopDone[key]; else S.shopDone[key]=1;
    render(); return;
  }
  if((el=closest(t,'data-untoday'))){
    toggleArr(S.today, el.getAttribute('data-untoday')); save(); render(); return;
  }
  if(t.id==='clearToday'){ S.today=[]; S.shopDone={}; save(); render(); return; }
  if(t.id==='copyShop'){ copyText(shopText()); return; }
  if(t.id==='wkShop'){
    if(S.weekPlan){
      var cnt=0;
      for(i=0;i<S.weekPlan.length;i++){
        var p=S.weekPlan[i];
        if(p.a && !inArr(S.today,p.a.id)){ S.today.push(p.a.id); cnt++; }
        if(p.b && !inArr(S.today,p.b.id)){ S.today.push(p.b.id); cnt++; }
      }
      save(); closeSheet(); go('shop'); toast('已加入 '+cnt+' 道菜的缺料');
    }
    return;
  }
  if(t.id==='wkRe'){ openWeek(); return; }

  /* --- 我的 --- */
  if((el=closest(t,'data-goal'))){ S.prefs.goal=el.getAttribute('data-goal'); save(); render(); return; }
  if((el=closest(t,'data-spicy'))){ S.prefs.maxSpicy=parseInt(el.getAttribute('data-spicy'),10); save(); render(); return; }
  if((el=closest(t,'data-tg'))){
    var kk=el.getAttribute('data-tg'); S.prefs[kk]=!S.prefs[kk]; save(); render(); return;
  }
  if((el=closest(t,'data-tool'))){ toggleArr(S.prefs.tools, el.getAttribute('data-tool')); save(); render(); return; }
  if(t.id==='editAvoid'){ openAvoid(); return; }
  if((el=closest(t,'data-av'))){
    toggleArr(S.prefs.avoid, el.getAttribute('data-av')); save();
    el.classList.toggle('on'); return;
  }
  if((el=closest(t,'data-unavoid'))){ toggleArr(S.prefs.avoid, el.getAttribute('data-unavoid')); save(); render(); return; }
  if(t.id==='clrHist'){ if(confirm('清空做过的菜的记录?')){ S.history=[]; save(); render(); } return; }
  if(t.id==='expData'){ copyText(JSON.stringify({selected:S.selected,inventory:S.inventory,prefs:S.prefs,favs:S.favs,history:S.history,today:S.today})); return; }
  if(t.id==='impData'){
    var raw=prompt('把之前导出的数据粘进来:');
    if(raw){
      try{
        var d=JSON.parse(raw);
        if(d.selected) S.selected=d.selected;
        if(d.inventory) S.inventory=d.inventory;
        if(d.favs) S.favs=d.favs;
        if(d.history) S.history=d.history;
        if(d.today) S.today=d.today;
        if(d.prefs){ var pp=defPrefs(); for(var k in pp) if(d.prefs[k]!==undefined) pp[k]=d.prefs[k]; S.prefs=pp; }
        save(); render(); toast('导入成功');
      }catch(e){ toast('数据格式不对,导入失败'); }
    }
    return;
  }
  if(t.id==='resetAll'){
    if(confirm('清空全部数据:勾选、库存、偏好、收藏、历史、清单。确定?')){
      try{ localStorage.removeItem(LSKEY); }catch(e){}
      S.selected=[]; S.inventory=[]; S.prefs=defPrefs(); S.favs=[]; S.history=[];
      S.today=[]; S.weekPlan=null; S.shopDone={}; S.roll=null; S.dayPlan=null;
      render(); toast('已重置');
    }
    return;
  }

  /* --- 做菜模式 --- */
  if(t.id==='ckClose'){ closeCook(); return; }
  if(t.id==='ckPrev'){ if(S.cookStep>0){ S.cookStep--; stopTimer(); renderCook(); } return; }
  if(t.id==='ckNext'){
    var r=recOf(S.cookId);
    S.cookStep++; stopTimer();
    if(r && S.cookStep>=r.st.length){
      S.history.push({id:r.id, at:Date.now()});
      if(S.history.length>200) S.history=S.history.slice(-200);
      save();
    }
    renderCook(); return;
  }
  if(t.id==='ckDone'){ closeCook(); toast('已记入做过的菜'); return; }
  if(t.id==='tmBtn'){
    var rr=recOf(S.cookId);
    ensureAudio();   /* iOS:必须在这次点击(用户手势)里解锁音频 */
    if(S.timer) { stopTimer(); renderCook(); }
    else if(rr && rr.st[S.cookStep]) startTimer(rr.st[S.cookStep].m*60);
    return;
  }
});

/* 搜索输入:只重绘 #pickBody,绝不动 #q 本身 —— 否则中文输入法组字会被打断 */
function refreshPick(){
  var pb=$('#pickBody'); if(pb) pb.innerHTML=pickBody();
  var clr=$('#qclr');    if(clr) clr.style.display = S.q ? '' : 'none';
}
function refreshChips(){ var w=$('#chipWrap'); if(w) w.innerHTML=chipBar(); }
function refreshCta(){ var b=$('#goDish'); if(b) b.textContent=ctaText(); }
/* 勾选食材后的局部刷新:不重建 #q,手机键盘和输入焦点都能保住 */
function refreshAfterPick(){ refreshChips(); refreshCta(); renderTabs(); }
document.addEventListener('input', function(ev){
  if(ev.target.id==='q'){
    /* 拼音正在组字(候选未选定)时先不过滤,避免闪一屏「没找到」 */
    if(ev.isComposing) return;
    S.q=ev.target.value;
    refreshPick();
    return;
  }
  if(ev.target.id==='kcalCap'){
    var v=parseInt(ev.target.value,10);
    S.prefs.kcalCap = (isNaN(v)||v<=0) ? null : v;
    save();
  }
});

/* 输入法组字结束:此时 value 才是完整汉字,补一次过滤 */
document.addEventListener('compositionend', function(ev){
  if(ev.target.id==='q'){ S.q=ev.target.value; refreshPick(); }
});

/* iOS:软键盘弹起时隐藏吸底 CTA(fixed 元素会跟着键盘乱跳) */
document.addEventListener('focusin', function(ev){
  if(ev.target.id==='q') document.body.classList.add('kb');
});
document.addEventListener('focusout', function(ev){
  if(ev.target.id==='q') document.body.classList.remove('kb');
});

/* Esc 关闭 */
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){
    if($('#cook').classList.contains('on')) closeCook();
    else if($('#sheet').classList.contains('on')){ closeSheet(); render(); }
  }
  if($('#cook').classList.contains('on')){
    if(ev.key==='ArrowRight'||ev.key===' '){ ev.preventDefault(); var b=$('#ckNext'); if(b) b.click(); }
    if(ev.key==='ArrowLeft'){ var p=$('#ckPrev'); if(p&&!p.disabled) p.click(); }
  }
});

/* 复制(file:// 下 clipboard API 常被拒,用 textarea 兜底) */
function copyText(s){
  var ok=false;
  try{
    var ta=document.createElement('textarea');
    ta.value=s;
    ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    ok=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ ok=false; }
  if(ok){ toast('已复制到剪贴板'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){ toast('已复制到剪贴板'); })
      .catch(function(){ fallbackShow(s); });
  }else fallbackShow(s);
}
function fallbackShow(s){
  openSheet('复制清单',
    '<div class="hint" style="margin-bottom:10px">这个浏览器不让自动复制。手动全选下面的文字复制走:</div>'
    + '<textarea readonly style="width:100%;height:52vh;font-size:14px;line-height:1.7;padding:10px;'
    + 'border:1px solid var(--line-2);border-radius:4px;background:var(--surface);font-family:var(--sans)">'
    + esc(s)+'</textarea>', '<button class="btn" id="sfDone">关闭</button>');
}

/* ==========================================================================
   第 11 层 · 启动与自检
   ========================================================================== */

/* 数据自检:菜谱引用的食材 id 是否都存在、菜谱 id 是否重复 */
function selfCheck(){
  var seen={}, bad=[], dup=[];
  for(var i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    if(seen[r.id]) dup.push(r.id); else seen[r.id]=1;
    var a=r.m.concat(r.s);
    for(var j=0;j<a.length;j++) if(!IMAP[a[j].i]) bad.push(r.id+' → '+a[j].i);
    for(j=0;j<r.se.length;j++) if(!IMAP[r.se[j]]) bad.push(r.id+' → se:'+r.se[j]);
    for(j=0;j<r.tl.length;j++){
      var okT=false; for(var k=0;k<TOOLS.length;k++) if(TOOLS[k].id===r.tl[j]) okT=true;
      if(!okT) bad.push(r.id+' → tool:'+r.tl[j]);
    }
  }
  if(bad.length) console.warn('[小付,今天吃什么?] 数据自检发现未知引用:', bad);
  if(dup.length) console.warn('[小付,今天吃什么?] 菜谱 id 重复:', dup);
  if(!bad.length && !dup.length) console.log('[小付,今天吃什么?] 数据自检通过 · '+RECIPES.length+' 道菜 · '+ING.length+' 项食材');
}

load();
selfCheck();
render();

/* 暴露给控制台,方便调试 */
window.EW={S:S, RECIPES:RECIPES, ING:ING, match:match, render:render};

})();
